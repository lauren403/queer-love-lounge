# netlify.toml — Queer Love Lounge
# Static site. The repo root IS the published site: no build step.
# Netlify [[headers]] rules work here because every page is a real static
# file. (The ADHD Hub needs its headers set in code instead, because its
# pages come from an SSR function that bypasses these rules.)

[build]
  publish = "."
  command = ""

# ------------------------------------------------------------------
# Security & privacy headers.
# CSP is REPORT-ONLY to start. This site loads Google Fonts, MailerLite,
# and — only after the visitor accepts the cookie banner — GA4.
# (The Meta pixel was removed from this site on 8 October 2026.) Because the consent-gated scripts do not load on a first
# visit, the policy has not been observed against real post-consent
# traffic yet. Watch the console for violations, then rename the header
# to Content-Security-Policy to enforce it.
# ------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://assets.mlcdn.com; script-src 'self' 'unsafe-inline' https://static.mailerlite.com https://assets.mlcdn.com https://*.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://assets.mlcdn.com https://assets.mailerlite.com https://static.mailerlite.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://clientportal.zandahealth.com; form-action 'self' https://assets.mlcdn.com https://assets.mailerlite.com"

# Content-hashed images never change — cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must revalidate so edits go live immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ------------------------------------------------------------------
# One canonical home. Every other hostname that resolves to this site
# is redirected, so nothing competes with the real domain in search and
# nobody bookmarks or shares the wrong URL.
# ------------------------------------------------------------------

# Netlify's default subdomain.
[[redirects]]
  from = "https://bbc-queer-love-lounge.netlify.app/*"
  to = "https://queerlovelounge.com.au/:splat"
  status = 301
  force = true

# The pre-rename domain. Kept resolving on purpose so old links survive,
# but it must redirect rather than serve a duplicate copy of the site.
# ("Queer Love Lab" became "Queer Love Lounge" on 29 July 2026.)
[[redirects]]
  from = "https://queerlovelab.bodybelongingclinic.com.au/*"
  to = "https://queerlovelounge.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://queerlovelab.bodybelongingclinic.com.au/*"
  to = "https://queerlovelounge.com.au/:splat"
  status = 301
  force = true

# The subdomain this site launched on. Kept resolving forever so every
# link, citation and bookmark already in circulation survives — but it
# must 301 page-for-page to the real domain rather than serve a
# duplicate copy. Explicit rules here rather than relying on Netlify's
# implicit primary-domain behaviour, so the mapping is deterministic.
# (Moved to queerlovelounge.com.au on 24 August 2026.)
[[redirects]]
  from = "https://queerlovelounge.bodybelongingclinic.com.au/*"
  to = "https://queerlovelounge.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://queerlovelounge.bodybelongingclinic.com.au/*"
  to = "https://queerlovelounge.com.au/:splat"
  status = 301
  force = true

# ------------------------------------------------------------------
# The 75 card library is retired from the public site while the deck
# is rebuilt (decided 7 October 2026). The ten card page replaces it.
# The file stays in the repo for session use; these rules stop it
# being served, and send every old link to the ten.
# ------------------------------------------------------------------
[[redirects]]
  from = "/lounge-method-deck.html"
  to = "/lounge-method-cards"
  status = 301
  force = true

[[redirects]]
  from = "/lounge-method-deck"
  to = "/lounge-method-cards"
  status = 301
  force = true

